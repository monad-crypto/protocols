# This workflow runs scripts/ProtocolsTable.py and opens a PR with the updated protocols CSV and JSON files

name: Generate CSV and JSON files

on:
  push:
    branches: [ main, master ]

concurrency:
  group: generate-aggregates
  cancel-in-progress: true

jobs:
  generate-csv:
    runs-on: ubuntu-latest

    permissions:
      # The default GITHUB_TOKEN needs to push the chore/update-aggregates
      # branch and open a PR against main.
      contents: write
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Run script (testnet)
        run: |
          source .venv/bin/activate
          python scripts/ProtocolsTable.py --network testnet

      - name: Run script (mainnet)
        run: |
          source .venv/bin/activate
          python scripts/ProtocolsTable.py --network mainnet

      - uses: peter-evans/create-pull-request@v7
        with:
          branch: chore/update-aggregates
          commit-message: "chore: update protocols CSV and JSON files"
          title: "chore: update protocols CSV and JSON files"
          body: "Automated update from the Generate CSV and JSON files workflow."
          add-paths: |
            protocols-*.csv
            protocols-*.json
          sign-commits: true
          delete-branch: true
